  .joker.celebrate{animation:jokerGlow 1.4s ease-in-out 3;}
  @keyframes jokerGlow{0%,100%{box-shadow:0 8px 20px rgba(74,95,165,.10), inset 0 0 0 1px rgba(255,255,255,.9), inset 0 0 0 5px rgba(255,253,246,.65), inset 0 0 0 6px rgba(70,65,90,.14);}50%{box-shadow:0 0 0 6px rgba(207,95,118,.22), 0 14px 34px rgba(207,95,118,.30), inset 0 0 0 1px rgba(255,255,255,.95), inset 0 0 0 5px rgba(255,253,246,.65), inset 0 0 0 6px rgba(70,65,90,.14);}}

  footer{margin-top:28px; text-align:center; font-size:11px; color:#5d6484; line-height:2; letter-spacing:.14em;}

const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
let stars = [];

  stars = Array.from({length:130}, ()=>({x:Math.random()*cv.width, y:Math.random()*cv.height,

/* 52 颗瞬间之星（2026-11-13 与 ChatGPT 讨论后加强）：与背景星分离，按爱心曲线固定排布，亮星暖黄带光晕，新点亮时有扩散脉冲，集齐 52 连线成爱心。 */
let pulse = null;
function heartPoints(){
  const pts = [];
  const cx = cv.width/2, cy = cv.height*0.36;
  const sc = Math.min(cv.width/34, cv.height/38);
  for(let k=0;k<52;k++){
    const t = (k/52)*Math.PI*2;
    const x = 16*Math.pow(Math.sin(t),3);
    const y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    pts.push({x: cx + x*sc, y: cy - y*sc});
  }
  return pts;
}
function drawStars(lit){
  ctx.clearRect(0,0,cv.width,cv.height);
  stars.forEach((s)=>{
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
  const hp = heartPoints();
  if(lit >= 52){
    ctx.globalAlpha = .45; ctx.strokeStyle = '#ffd9e2'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    hp.forEach((pt,k)=>{ if(k===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
    ctx.closePath(); ctx.stroke();
  }
  hp.forEach((pt,k)=>{
    if(k < lit){
      ctx.globalAlpha = .95; ctx.fillStyle = '#fff6c9';
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.7, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = .32; ctx.beginPath(); ctx.arc(pt.x, pt.y, 6.5, 0, Math.PI*2); ctx.fill();
      if(pulse && pulse.n === k){
        const e2 = (performance.now() - pulse.t0)/900;
        if(e2 < 1){
          ctx.globalAlpha = .55*(1-e2); ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, 6 + e2*26, 0, Math.PI*2); ctx.stroke();
        }
      }
    } else {
      ctx.globalAlpha = .15; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 1.6, 0, Math.PI*2); ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}
function pulseLoop(){
  if(!pulse) return;
  drawStars(readSet.size);
  if(performance.now() - pulse.t0 < 920) requestAnimationFrame(pulseLoop);
  else { pulse = null; drawStars(readSet.size); }
}
